<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mathis Ghio</title>
  <script>
    // SPA routing for GitHub Pages — encode path into query string,
    // then redirect to root so index.html is served (not a 404).
    (function () {
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body></body>
</html>
